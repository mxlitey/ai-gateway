# AI Gateway Docker Compose 部署示例。
#
# 用法：
#   1) 修改下面 environment 里的 AIGW_ADMIN_PASSWORD
#   2) docker compose up -d --build
#   3) 浏览器打开 http://localhost:8788
#
# 说明：/data 存放数据库与日志；/plugins 与 /mcp 是插件与本地 MCP 目录。
# 镜像**不自带**插件与 MCP，请把内容放进下面对应的宿主机目录：
#   ./plugins/<插件id>/plugin.json   例如从 ai-gateway-v<版本>-plugins-mcp.zip 解压
#   ./mcp/<服务名>/mcp.json
# 首次 up 会自动创建这两个空目录，放好内容后在面板「插件」/「MCP 服务器」页
# 点「重新扫描」（或重启容器）即可看到。

services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      # 版本号由 Dockerfile 读取仓库根目录的 VERSION 文件，无需在这里重复
    image: ai-gateway:latest
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口；容器内固定 8787，如需改宿主机端口只改左侧
      # 默认 8788，避免与本机 Windows 桌面版的 8787 冲突
      - "${AIGW_HOST_PORT:-8788}:8787"
      # 插件登录回调直接落在插件自己的回环端口上，不需要额外映射。
      # 容器内的 127.0.0.1 不是宿主机的回环地址，因此授权后浏览器打不开回调页：
      # 把地址栏里的完整链接粘回面板登录卡片即可（见 docs/plugin-spec.md §6.7）。
    environment:
      # 监听地址与端口由镜像内置（0.0.0.0:8787），一般无需覆盖
      AIGW_HOST: "0.0.0.0"
      AIGW_PORT: "8787"
      # 首次启动用它初始化管理员密码；初始化后改密请走面板
      AIGW_ADMIN_PASSWORD: ${AIGW_ADMIN_PASSWORD:-change-me}
      # 日志级别：debug | info | warn | error（也可在面板「运行期设置」中热改）
      AIGW_LOG_LEVEL: ${AIGW_LOG_LEVEL:-info}
      # 对象存储（S3 兼容）不在环境变量里配置：启动后登录面板「设置 → 对象存储」
      # 填写 Endpoint / Bucket / Access Key / Secret Key 等并保存，立即生效、无需重启。
      # 未配置前 /v1/storage/tickets 返回 501。
    volumes:
      - ai-gateway-data:/data
      # bind mount：插件与本地 MCP 由用户自己放进来（镜像不自带）
      - ./plugins:/plugins
      - ./mcp:/mcp
    healthcheck:
      # debian-slim 没有 wget/curl，用镜像内的 python3 探活
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ai-gateway-data:
