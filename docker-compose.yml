# AI Gateway Docker Compose 部署示例。
#
# 用法：
#   1) 修改下面 environment 里的 AIGW_ADMIN_PASSWORD
#   2) docker compose up -d --build
#   3) 浏览器打开 http://localhost:8787
#
# 说明：/data 存放数据库、日志与插件私有数据；/plugins 存放插件目录。
# 两者都用命名卷持久化，容器重建不会丢配置与插件。
#
# 注意：镜像已内置 TRAE / WorkBuddy 插件与 mcp/github-search 本地 MCP 服务器，
# 但命名卷只在「首次创建」时从镜像初始化。
# 如果你跑过旧版镜像（ai-gateway-plugins 卷已存在且里面是空的），内置插件不会自动进去，
# 需先删掉旧卷再启动：docker volume rm ai-gateway-plugins（或换一个新的卷名）。

services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.3.0}
    image: ai-gateway:latest
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口；容器内固定 8787，如需改宿主机端口只改左侧
      # 默认 8788，避免与本机 Windows 桌面版的 8787 冲突
      - "${AIGW_HOST_PORT:-8788}:8787"
      # 插件登录回调入口在容器内的「网关端口 +1」= 8788，且回调地址里写死的是
      # http://127.0.0.1:8788 —— 想让宿主机浏览器直达，宿主机端口也必须恰好是 8788：
      #   AIGW_HOST_PORT=8787 AIGW_CALLBACK_HOST_PORT=8788 docker compose up -d
      # 保持默认时（宿主机 8788 已被面板占用）不映射也行：授权后把地址栏里的链接
      # 粘贴回面板即可完成登录（见 docs/plugin-spec.md §6.7）。
      # - "8788:8788"
    environment:
      # 监听地址与端口由镜像内置（0.0.0.0:8787），一般无需覆盖
      AIGW_HOST: "0.0.0.0"
      AIGW_PORT: "8787"
      # 首次启动用它初始化管理员密码；初始化后改密请走面板
      AIGW_ADMIN_PASSWORD: ${AIGW_ADMIN_PASSWORD:-change-me}
      # 日志级别：debug | info | warn | error（也可在面板「运行期设置」中热改）
      AIGW_LOG_LEVEL: ${AIGW_LOG_LEVEL:-info}
      # 如需自建价格源镜像，可在此覆盖
      # AIGW_PRICE_ENDPOINT: ""
    volumes:
      - ai-gateway-data:/data
      - ai-gateway-plugins:/plugins
      - ai-gateway-mcp:/mcp
    healthcheck:
      # debian-slim 没有 wget/curl，用镜像内的 python3 探活
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ai-gateway-data:
  ai-gateway-plugins:
  ai-gateway-mcp:
